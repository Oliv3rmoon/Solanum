# Solanum - cloud build of the PS5 app, with the host checks (Dulcamara's workflow, which is Mandrake's).
# A version tag (X.Y.Z, the NP_VERSION of src/nightshade.h) pushed to Oliv3rmoon/Solanum also publishes:
# job "release" puts the PPSA76526.zip and SHA256SUMS this run built on a GitHub release, the latest, which the
# app's own update check (src/update_release.h) then offers. Nothing built anywhere else is ever attached, and a
# release that already has a ZIP is never changed.
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Download the results from the run's page, under Artifacts:
#   PPSA76526    PPSA76526.zip, the same zip the releases carry
#   release      it and SHA256SUMS: what a release publishes

name: Build Solanum

on:
  push:
    branches:
      - "**"
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ps5:
    name: PS5 app
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The attest step signs with this run's identity and stores the attestation.
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
      TITLE_ID: PPSA76526
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # A release's tag is the app's version: 0.1.0 is NP_VERSION "0.1.0" and contentVersion 00.001.000.
      - name: Check the tag names this version
        if: github.ref_type == 'tag'
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import json, re, sys
          tag = sys.argv[1]
          version = re.search(r'#define\s+NP_VERSION\s+"([^"]+)"', open("src/nightshade.h").read()).group(1)
          content = json.load(open("sce_sys/param.json"))["contentVersion"]
          parts = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
          want = "%02d.%03d.%03d" % tuple(int(p) for p in parts.groups()) if parts else None
          if tag != version or content != want:
              raise SystemExit(f"tag {tag}, NP_VERSION {version}, contentVersion {content}: they must agree")
          print(f"{tag}: NP_VERSION {version}, contentVersion {content}")
          PY

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18 llvm-18 libclang-rt-18-dev make ninja-build ccache cmake \
            pkg-config tar unzip wget zip python3 python3-venv zstd

      - name: Restore downloaded SDK and libraries
        uses: actions/cache@v4
        with:
          path: |
            .deps/native
            .deps/pacbrew
            .deps/lapy
          key: deps-${{ runner.os }}-${{ hashFiles('tools/setup-*-dependencies.sh', 'tools/build-lapy-helper.py', 'tools/fetch-radv.sh') }}

      # Frame generation for the Vulkan screen is rebuilt only when its sources or its build script change: its
      # build stamp (build/framegen-ps5/.stamp) says which it was built from.
      - name: Restore frame generation
        uses: actions/cache@v4
        with:
          path: build/framegen-ps5
          key: framegen-ps5-${{ hashFiles('third_party/framegen/**', 'src/platform/vk/fg_bridge.h', 'tools/build-framegen.sh', 'tooling/prospero-clang18') }}

      # On the build machine: the catalog, its pinned releases and custom catalogs, the release's file, checksums (a
      # download that isn't the release's is never unpacked), resuming, roll backs from kept ZIPs, holds and skips,
      # where an app is, the launch payload's conversation, the Konami code and the random tips and eggs
      # (tests/store_check.c); the install helper's whole conversation, installs on any drive and uninstalls
      # (tests/helper_check.cpp); Solanum's own update's release decision; the background music's playlist, WAV reader
      # and mixer (tests/music_check.c); and the translations (tests/test_i18n.py).
      - name: Host checks
        env:
          CC: clang-18
          CXX: clang++-18
        run: python3 -m unittest tests.test_store tests.test_update_release tests.test_music tests.test_i18n -v

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: make

      - name: Check system module imports
        run: python3 tools/check-imports.py dist/PPSA76526/eboot.bin

      # The same PPSA76526.zip that tools/make_release.py packs for a release.
      - name: Pack PPSA76526.zip
        run: python3 tools/make_release.py --skip-build

      # What Solanum's own update unpacks, and what goes in /data/homebrew: the app folder, this title at this
      # version, with the install helper and the launch payload beside eboot.bin.
      - name: Check PPSA76526.zip
        run: |
          python3 - PPSA76526.zip "$TITLE_ID" <<'PY'
          import json, re, sys, zipfile
          path, title = sys.argv[1:3]
          version = re.search(r'#define\s+NP_VERSION\s+"([^"]+)"', open("src/nightshade.h").read()).group(1)
          content = "%02d.%03d.%03d" % tuple(int(p) for p in version.split("."))
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              if not names or archive.testzip() is not None:
                  raise SystemExit("ZIP check failed: empty or damaged")
              outside = sorted(n for n in names if not n.startswith(title + "/"))
              if outside:
                  raise SystemExit(f"ZIP check failed: entries outside {title}/: {outside[:5]}")
              for needed in ("eboot.bin", "sce_sys/param.json", "sce_sys/icon0.png", "sce_sys/pic0.dds",
                             "sce_sys/pic1.dds", "self-updater.elf", "app-launch.elf", "lapy.elf",
                             "licenses/LICENSE-Solanum.txt", "licenses/LICENSE-miniz.txt", "licenses/LICENSE-qrcodegen.txt",
                             "licenses/THIRD-PARTY.txt", "licenses/Lapy-MIT.txt"):
                  if f"{title}/{needed}" not in names:
                      raise SystemExit(f"ZIP check failed: {title}/{needed} is missing")
              # a store of open-source homebrew: no game files or packages of any kind
              games = sorted(n for n in names if re.search(r"(?i)\.(nsp|nsz|xci|xcz|pkg|ffpkg|ffpfsc|iso|cue|chd|pbp|cso|exfat)$", n))
              if games:
                  raise SystemExit(f"ZIP check failed: game or package files in the package: {games[:5]}")
              param = json.loads(archive.read(f"{title}/sce_sys/param.json"))
              name = param["localizedParameters"]["en-US"]["titleName"]
              if param["titleId"] != title or param["contentVersion"] != content or name != "Solanum":
                  raise SystemExit(f"ZIP check failed: param.json is {param['titleId']} {param['contentVersion']} {name!r}")
              for payload in ("self-updater.elf", "app-launch.elf"):
                  data = archive.read(f"{title}/{payload}")
                  if data[:4] != b"\x7fELF":
                      raise SystemExit(f"ZIP check failed: {payload} is not an ELF")
              print(f"{len(names)} entries; {title} {content} {name!r}")
          PY

      - name: Write SHA256SUMS
        run: |
          mkdir -p release
          cp PPSA76526.zip release/
          (cd release && sha256sum PPSA76526.zip > SHA256SUMS && cat SHA256SUMS)

      # Signed provenance: this file was built by this workflow from this commit. Anyone can check a downloaded
      # copy with `gh attestation verify PPSA76526.zip -R Oliv3rmoon/Solanum`. Not for pull requests
      # (a fork's run cannot sign), and not in a private repository (the plan does not include it).
      - name: Attest the release files
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/PPSA76526.zip

      - name: Upload PPSA76526.zip
        uses: actions/upload-artifact@v4
        with:
          name: PPSA76526
          path: PPSA76526.zip
          if-no-files-found: error

      - name: Upload the release files
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release/PPSA76526.zip
            release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: ps5
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out the release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases

      - name: Download the files this run built
        uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Check the download
        run: |
          set -euo pipefail
          cd release
          mapfile -d '' files < <(find . -type f -print0)
          if (( ${#files[@]} != 2 )) || [[ ! -f PPSA76526.zip || ! -f SHA256SUMS ]]; then
            echo "Expected exactly PPSA76526.zip and SHA256SUMS in the artifact." >&2
            exit 1
          fi
          sha256sum -c SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$GITHUB_REF_NAME
          assets=(release/PPSA76526.zip release/SHA256SUMS)
          notes="docs/releases/$TAG.md"
          # The files of a release come from the run of its tag, once. A release without a ZIP (notes
          # written in advance, or a draft) gets them and keeps its title and notes; one that already has
          # a ZIP is never touched, because players may have checked that ZIP against its SHA256SUMS.
          if names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null); then
            if grep -qx 'PPSA76526.zip' <<< "$names"; then
              echo "::warning title=Release files not from this run::The release $TAG already has PPSA76526.zip; it was not replaced."
            else
              gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
            fi
          elif [[ -f $notes ]]; then
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title "Solanum $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title "Solanum $TAG" --generate-notes
          fi
