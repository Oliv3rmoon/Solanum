name: Suggestion
description: An idea for a new feature or an improvement
labels: [suggestion]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! One idea per suggestion, please. Search first: if someone already
        suggested it, add a 👍 and your thoughts there. To list an app in the store, open a pull
        request on Oliv3rmoon/Solanum-Catalog instead.

  - type: textarea
    id: problem
    attributes:
      label: What would it help with?
      description: The situation or annoyance behind the idea. This matters more than the solution.
      placeholder: I install apps on a USB drive and have to move them by hand.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What Solanum could do. Screens, buttons, settings, whatever helps explain it.
      placeholder: Let me choose the drive a new app goes on.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of Solanum?
      options:
        - Browse and search
        - App pages
        - Updates
        - Installed
        - Installing and opening
        - Settings
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I searched the existing suggestions and this isn't one of them.
          required: true
        - label: It doesn't involve getting games, keys or anything that isn't open-source homebrew (those won't be added).
          required: true
