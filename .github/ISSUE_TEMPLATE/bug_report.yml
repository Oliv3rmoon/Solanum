name: Bug report
description: Something in Solanum doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! One problem per report, please. A problem with an app Solanum installed
        belongs in that app's own repository; a problem installing, updating or opening it belongs here.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
      placeholder: Updating Physalis stopped at "Unpacking" and said the helper stopped.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps from starting Solanum. Does it happen every time?
      placeholder: |
        1. Start Solanum, go to Updates
        2. Choose Physalis and press X
        3. It stops at "Unpacking" (every time)
    validations:
      required: true

  - type: input
    id: app
    attributes:
      label: App
      description: "Only if it's about one of the catalog's apps: its name and the version Solanum offered."
      placeholder: Physalis 01.002.001

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - The catalog doesn't load
        - An app's release isn't found or can't be installed
        - Installing or updating fails
        - Opening an app fails
        - Solanum crashes or closes
        - The PS5 crashes or freezes
        - Menus, search or settings
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Solanum version
      description: The About tab's first line
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: setup
    attributes:
      label: PS5 and jailbreak
      description: Model, firmware, and what you load (and in what order).
      placeholder: PS5 slim, 13.60, etaHEN 2.x + kstuff, ShadowMountPlus
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Logs
      description: |
        Attach `/data/solanum/logs/solanum.log`, and for an install `updater.log` (for Open, `app-launch.log`).
        Copy them with FTP **right after** the problem, before starting Solanum again (each start replaces
        solanum.log). After a crash it ends with a `crash:` section; that's the most useful part.
      placeholder: Drag the log files here.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Screenshot
      description: A photo of the screen helps.

  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I searched the existing issues and this isn't one of them.
          required: true
